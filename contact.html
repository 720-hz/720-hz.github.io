  <section class="reveal" style="border-top:none;padding-top:52px;">
    <div class="contact">
      <h1>Want to talk about a machine learning role?</h1>
      <p>Send a message straight to my inbox — I read every one myself, no email client required.</p>

      <form id="contact-form" class="contact-form">
        <input type="hidden" name="_subject" value="New message from 720-hz.github.io">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <textarea name="message" rows="4" placeholder="What's on your mind?" required></textarea>
        <button type="submit" class="btn accent" id="contact-submit">Send message</button>
        <p id="contact-status" class="contact-status" role="status" aria-live="polite"></p>
      </form>

      <p class="contact-fallback">Prefer email directly? <a href="mailto:ziadkhaledshatah@gmail.com?subject=Let%27s%20talk">ziadkhaledshatah@gmail.com</a></p>
    </div>
  </section>
